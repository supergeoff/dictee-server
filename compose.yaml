# Build commun de models et nemo : la même image, donc la même version de NeMo-Speech.cpp, écrite une seule fois.
x-nemo-build: &nemo-build
  context: https://github.com/supergeoff/dictee-server.git#main:nemo
  args:
    NEMO_VERSION: "0.3.0"

services:
  models:
    build: *nemo-build
    restart: "no"
    env_file: .env
    command: ["pull-models.sh"]
    volumes:
      - nemo-models:/models
    deploy:
      resources:
        limits:
          memory: 512M
  nemo:
    build: *nemo-build
    restart: unless-stopped
    env_file: .env
    command: ["serve.sh"]
    expose:
      - "8000"
    volumes:
      - nemo-models:/models:ro
    depends_on:
      models:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    deploy:
      resources:
        limits:
          memory: 3G
  dictee:
    build:
      context: https://github.com/supergeoff/dictee-server.git#main:dictee
      target: runtime
    restart: unless-stopped
    # Docker attend 30 s après SIGTERM avant SIGKILL : uvicorn en laisse 20 aux requêtes, puis arrête les tâches.
    stop_grace_period: 30s
    env_file: .env
    expose:
      - "8000"
    volumes:
      - dictee-data:/data
    depends_on:
      nemo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - default
      - dokploy-network
    deploy:
      resources:
        limits:
          memory: 512M
volumes:
  dictee-data: null
  nemo-models: null
networks:
  dokploy-network:
    external: true
