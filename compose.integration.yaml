# Compose de test local, autonome : `make integration` construit les images depuis le dépôt et publie les ports sur
# 127.0.0.1. Le compose qui fait tourner dictee en production vit dans Dokploy, seule source des composes. Celui-ci en
# reprend les services et les limites de mémoire. La version de NeMo-Speech.cpp n'y est pas écrite : elle vient de la
# variable NEMO_VERSION, que `make integration` exige (NEMO_VERSION=<version> make integration, avec la valeur du compose
# de Dokploy).
x-nemo-build: &nemo-build
  context: ./nemo
  args:
    NEMO_VERSION: "${NEMO_VERSION:-}"

services:
  models:
    build: *nemo-build
    restart: "no"
    env_file: .env
    command: ["pull-models.sh"]
    volumes:
      - nemo-models:/models
    deploy:
      resources:
        limits:
          memory: 512M
  nemo:
    build: *nemo-build
    restart: unless-stopped
    env_file: .env
    command: ["serve.sh"]
    ports:
      - "127.0.0.1:18001:8000"
    volumes:
      - nemo-models:/models:ro
    depends_on:
      models:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    deploy:
      resources:
        limits:
          memory: 3G
  dictee:
    build:
      context: ./dictee
      target: runtime
    restart: unless-stopped
    # Docker attend 30 s après SIGTERM avant SIGKILL : uvicorn en laisse 20 aux requêtes, puis arrête les tâches.
    stop_grace_period: 30s
    env_file: .env
    ports:
      - "127.0.0.1:18000:8000"
    volumes:
      - dictee-data:/data
    depends_on:
      nemo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M
volumes:
  dictee-data: null
  nemo-models: null
